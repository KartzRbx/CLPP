name: Luau documentation validation
on:
  push:
    branches: [luau, "codex/**"]
    paths: ["docs/**", "www/**", "scripts/**", "Cargo.toml", "src/support.rs", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run docs:build
      - run: node scripts/check-doc-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: luau-documentation
          path: www/dist
# The VM Pages workflow composes this site under /CLPP/luau/ before deploying.

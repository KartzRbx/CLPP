name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# GitHub Pages must use branch `gh-pages` and folder `/` (repo root on that
# branch). Starlight builds to www/dist with base `/CLPP/`.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build Starlight
        run: |
          npm install
          npm run docs:build
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/dist

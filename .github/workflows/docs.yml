name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# GitHub Pages must use branch `gh-pages` and folder `/` (repo root on that
# branch), not `/docs`. The Moonwave site lives at the branch root: index.html,
# docs/, and api/Builtins. Folder `/docs` would 404 the API tab.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Moonwave site
        run: npm run docs:build
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

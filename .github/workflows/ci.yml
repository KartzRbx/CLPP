name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node editors/vscode/intellisense.test.js

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check libs.json vs headers
        shell: bash
        run: python3 scripts/check_libs.py || python scripts/check_libs.py

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node editors/vscode/intellisense.test.js
      - run: cargo test
      - name: Check libs.json vs headers
        shell: bash
        run: python3 scripts/check_libs.py || python scripts/check_libs.py

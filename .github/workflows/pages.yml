name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", "www/**", "tools/vscode/syntaxes/**", ".github/workflows/pages.yml", "scripts/compose-luau-docs.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: www
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: www
        run: npm run build
      - name: Check out the independent Luau compiler release
        uses: actions/checkout@v4
        with:
          ref: v0.8.2
          path: compiler-docs
      - name: Build the Luau compiler documentation
        working-directory: compiler-docs
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build
          node scripts/check-doc-links.mjs
      - name: Compose both products and redirects for legacy Luau links
        run: node scripts/compose-luau-docs.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

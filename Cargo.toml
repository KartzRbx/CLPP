[package]
name = "clpp"
version = "0.2.3"
edition = "2021"
description = "CL++ compiler — a C++-inspired language that compiles to Luau"
license = "MIT"
repository = "https://github.com/KartzRbx/CLPP"
homepage = "https://github.com/KartzRbx/CLPP"
keywords = ["luau", "roblox", "compiler", "language"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "clpp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"

[dev-dependencies]
pretty_assertions = "1"

[package]
name = "clpp"
version = "0.8.0-cf"
edition = "2021"
description = "CL++ compiler — a C++-inspired language that compiles to Luau"
license = "MIT"
repository = "https://github.com/KartzRbx/CLPP"
homepage = "https://github.com/KartzRbx/CLPP"
keywords = ["luau", "roblox", "compiler", "language"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "clpp"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "unwind" (miette backtraces; do not abort)

[workspace]
resolver = "2"
members = [
    ".",
    "crates/clpp_syntax",
    "crates/clpp_parser",
    "crates/clpp_hir",
    "crates/clpp_ty",
    "crates/clpp_codegen",
    "crates/clpp_lsp",
    "crates/clpp_cli",
]
exclude = ["fuzz"]

[workspace.dependencies]
rowan = "0.15"

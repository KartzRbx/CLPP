title = "CL++"
gitRepoUrl = "https://github.com/KartzRbx/CLPP"
gitSourceBranch = "main"
changelog = false

[docusaurus]
onBrokenLinks = "throw"
onBrokenMarkdownLinks = "warn"
favicon = "img/favicon.png"
organizationName = "KartzRbx"
projectName = "CLPP"
url = "https://kartzrbx.github.io"
baseUrl = "/CLPP/"
tagline = "A C++-inspired language that compiles to Luau — course, syntax, and API"

[home]
enabled = true
includeReadme = false
bannerImage = "img/home/banner.png"

[[home.features]]
title = "Write like C++"
description = "Types, structs, methods, and a familiar brace syntax — with operators designed for Roblox."
image = "img/home/write-cpp.png"

[[home.features]]
title = "Emits modern Luau"
description = "One source file becomes one Luau file. Rojo infers Script, LocalScript, or ModuleScript from the name."
image = "img/home/emits-luau.png"

[[home.features]]
title = "Language only"
description = "CL++ is syntax, semantics, and OOP. Cluaupp owns Roblox API wiring, generated headers, and project init."
image = "img/home/language-only.png"

